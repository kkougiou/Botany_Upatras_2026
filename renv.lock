      "RemoteRepo": "BioGeoBEARS",
      "RemoteUsername": "nmatzke",
      "RemoteRef": "HEAD",
      "RemoteSha": "71274118551b4299f13c0783df51c1829e8e93aa",
      "NeedsCompilation": "no"
    },
