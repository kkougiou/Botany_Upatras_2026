      "Version": "1.2.18",
      "Source": "Repository",
      "Date": "2024-08-20",
      "Title": "Estimation of (Local) False Discovery Rates and Higher Criticism",
      "Authors@R": "c(person(given = \"Bernd\", family = \"Klaus\", role = \"aut\"), person(given = \"Korbinian\", family = \"Strimmer\", role = c(\"aut\", \"cre\"), email = \"strimmerlab@gmail.com\"))",
