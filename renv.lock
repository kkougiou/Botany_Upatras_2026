      "Encoding": "UTF-8"
    },
    "BioGeoBEARS": {
      "Package": "BioGeoBEARS",
      "Version": "1.1.3",
      "Source": "GitHub",
      "Type": "Package",
      "Title": "BioGeography with Bayesian (and Likelihood) Evolutionary Analysis in R Scripts",
      "Date": "2023-04-20",
      "Author": "c(person(\"Nicholas J.\", \"Matzke\", email = \"matzke@berkeley.edu\", role = c(\"aut\", \"cre\", \"cph\")))",
      "Maintainer": "Nicholas J. Matzke <matzke@berkeley.edu>",
      "Remotes": "github::nmatzke/rexpokit, github::nmatzke/cladoRcpp",
      "Depends": [
        "R (>= 3.5.0)"
      ],
      "Imports": [
        "methods",
        "optimx",
        "parallel",
        "plotrix",
        "gdata",
        "GenSA",
        "rexpokit",
        "cladoRcpp",
        "ape",
        "phylobase",
        "phytools",
