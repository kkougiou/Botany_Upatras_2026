<style>
.copy-btn {

  color: #fff;
  background-color: #1a3e5c;

  cursor: pointer;
  opacity: 0;
  transition: opacity 0.3s ease;
  z-index: 100;
}
div.sourceCode, .appendix-block pre { position: relative; }
div.sourceCode:hover .copy-btn, .appendix-block pre:hover .copy-btn { opacity: 1; }
.copy-btn:hover { background-color: #2a5a84; }
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
  var codeBlocks = document.querySelectorAll('div.sourceCode, .appendix-block pre');
  
  codeBlocks.forEach(function(block, index) {
    var button = document.createElement('button');
    button.className = 'copy-btn';
    button.type = 'button';
    button.innerText = 'Copy';
    button.setAttribute('data-clipboard-target', '#code-target-' + index);
    
    var codeEl = block.querySelector('code, pre');
    if (!codeEl) codeEl = block; 
    codeEl.id = 'code-target-' + index;
    
    block.appendChild(button);
  });

  var clipboard = new ClipboardJS('.copy-btn');
  clipboard.on('success', function(e) {
    e.trigger.innerText = 'Copied!';
    setTimeout(function() { e.trigger.innerText = 'Copy'; }, 2000);
    e.clearSelection();
  });
});
</script>
